# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_instructions:
    - path: "note/規格書/**/*.md"
      instructions: |
        這是遊戲產品規格書（Obsidian vault，`note/規格書/` 是完整規格集，
        依編號 00~99 閱讀，00 是上位文件）。

        除了一般的文字與邏輯品質，這次改動如果對「數量、範圍、是否支援
        某功能、是否存在某系統」做出事實斷言（例如地點數量、村莊數量、
        MVP 範圍邊界），請額外檢查：

        1. 同一份 vault 裡其他檔案是否已經對同一件事做過不同或矛盾的
           斷言——尤其是《07_地點與行動.md》《13_系統分析與系統設計.md》
           《99_待規劃項目清單.md》這幾份跨主題常被引用、容易被忽略的檔案。
        2. 改動本身如果重述了某個本該有單一權威定義的事實（而不是連結
           過去），視為可疑：規格書慣例是事實只在一處定義，其他地方用
           `[[wikilink]]` 指過去，不要各自重寫一遍容易走鐘的敘述。

        發現跨檔案矛盾時，明確指出衝突的兩處（檔案＋行號/小節），
        不要只挑一邊當作正確答案自行採信；由 PR 作者或使用者決定
        哪一邊是現況。

        `note/交流/` 資料夾是暫存溝通區，內容會被刪除，不要建議
        其他檔案引用它，也不要以它的內容當作定案依據。
