; Godot export presets — 見 note/規格書/16_打包與發布規格書.md §2.1
; B1：Windows／macOS／Linux 三平台都要
; B6：本輪不做簽章／公證，codesign 相關欄位維持關閉
; §2.2（issue #772／#989）：sidecar 執行檔（各平台預編譯 llama-server）與
; 模型檔不隨 Godot 匯出自動打包——include_filter 收進 .pck 的檔案只有
; res:// 讀得到，llama_sidecar.gd 在匯出版解析的是執行檔旁的真實檔案系統
; 路徑再 OS.create_process()，.pck 內資源不是磁碟檔案，exec 不了。這兩種
; 檔案改由遊戲本體在玩家點擊「下載本機 AI 模型」時執行期主動下載
; （ModelDownloader，issue #989，推翻《16》B3），不是建置步驟；三個 preset
; 的 include_filter 維持 data/*.json，另外加上 THIRD_PARTY_LICENSES/* ——
; 這兩份授權文字檔很小，直接跟 .pck 一起匯出，不用跟著模型走下載那條路

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, THIRD_PARTY_LICENSES/*"
exclude_filter="note/*, .claude/*, .git/*, data/ai_config.json"
export_path="builds/windows/ailley.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/bptc=true
texture_format/s3tc=true
texture_format/etc=false
texture_format/etc2=false
binary_format/architecture="x86_64"
codesign/enable=false
codesign/timestamp=true
codesign/timestamp_server_url=""
codesign/digest_algorithm=1
codesign/description=""
codesign/custom_options=PackedStringArray()
application/modify_resources=true
application/icon="res://icon.svg"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
